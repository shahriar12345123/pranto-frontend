<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Primary Emblem Gradient (Electric Blue -> Cyan -> Violet) -->
    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Secondary Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Inner Shadow & Highlight Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" />

  <!-- Outer Border Glow -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#emblem-grad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" />

  <!-- Ambient Backdrop Glow behind logo -->
  <circle cx="256" cy="256" r="160" fill="url(#emblem-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Premium 'G' Monogram + Tech Bolt Emblem -->
  <g filter="url(#icon-shadow)">
    <!-- Outer Arc of the G Monogram -->
    <path d="M 336 172 
             C 310 138, 276 128, 232 128 
             C 160 128, 116 184, 116 256 
             C 116 328, 160 384, 232 384 
             C 300 384, 340 344, 344 276 
             L 240 276 
             L 240 228 
             L 396 228 
             C 398 240, 400 252, 400 268 
             C 400 368, 332 440, 228 440 
             C 124 440, 60 364, 60 256 
             C 60 148, 128 72, 236 72 
             C 294 72, 346 96, 384 140 
             Z" 
          fill="url(#emblem-grad)" />

    <!-- Sharp Lightning / Energy Core Overlay -->
    <path d="M 284 140 
             L 220 256 
             L 268 256 
             L 216 372 
             L 308 240 
             L 256 240 
             Z" 
          fill="url(#accent-grad)" opacity="0.9" />

    <!-- Tech Power Dot Accent -->
    <circle cx="372" cy="140" r="18" fill="#38bdf8" />
    <circle cx="372" cy="140" r="8" fill="#ffffff" />
  </g>
</svg>